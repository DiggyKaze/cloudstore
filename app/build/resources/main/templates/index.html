<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
         <a th:href="@{/}">CloudStore</a>
        </div>
        <div class="nav-links-right">
            <a th:href="@{/products}" class="nav-link nav-btn">Produkter</a>
            <a th:href="@{/register}" class="nav-link nav-btn">Registrera</a>
            <a th:href="@{/login}" class="nav-link nav-btn">Logga in</a>
        </div>
    </nav>

    <main class="content-container">

        <div class="welcome-box">
            <h1 th:text="${message}">Welcome to Spring Boot with Thymeleaf</h1>
            <p>Here you will see product from our sortiments.</p>
        </div>

        <div class="features">
            <div class="feature-card">
                <h3>Stort products</h3>
                <p>Products from FakeStore API in many catagories.</p>
            </div>

            <div class="feature-card">
                <h3>order</h3>
                <p>Add products to cart and order direkt.</p>
            </div>
        </div>
    </main>
</body>
</html>
