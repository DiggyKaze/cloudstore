<!DOCTYPE html>
xmlns:th="http://www.thymeleaf.org"
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My orders</title>
    <link rel="stylesheet" th:href="@{/css/shop.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" class="brand">CloudStore</a>
        <a th:href="@{/products}" class="nav-btn">Produkter</a>
    </nav>

    <main class="container">
        <h1>Mina beställningar</h1>

        <div class="order-card" th:each="order : ${orders}">
            <h2 th:text="'Order #' + ${order.id}"></h2>
            <p th:text="${order.createdAt}"></p>
            <p class="price" th:text="${order.totalPrice} + ' kr'"></p>
        </div>
    </main>
</body>
</html>
