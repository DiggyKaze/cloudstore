<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/css/shop.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <a th:href="@{/}">CloudStore
        </a>
    </div>
    <div class="nav-links-right">
        <a th:href="@{/}" class="nav-link nav-btn">Home</a>
        <button type="button"
                class="nav-link nav-btn cart-btn" onclick="openCart()">Cart
        </button>
    </div>
</nav>

<main class="content-container">
    <h1>Produkter</h1>
    <div class="product-grid" th:if="${products != null and !#arrays.isEmpty(products)}">
        <div class="product-card" th:each="product : ${products}">
            <img th:src="${product.image}" th:alt="${product.title}">
            <h3 th:text="${product.title}"></h3>
            <p class="price" th:text="${product.price} + ' kr'"></p>
            <button class="add-to-cart-btn"
                    th:data-id="${product.id}" th:data-title="${product.title}"
                    th:data-price="${product.price}" onclick="addToCart(this)">Add to Cart
            </button>
        </div>
    </div>
</main>

<div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>
<div id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
        <h2>Cart List</h2>
        <button class="close-btn" onclick="closeCart()">×</button>
    </div>
    <div class="cart-content">
        <div id="emptyCart" class="empty-cart">
            <div class="empty-cart-icon">🛒</div>
            <h3>Empty Cart</h3>
        </div>
    </div>
    <div class="cart-footer">
        <div class="cart-total">
            Total: <span id="cartTotal">0</span> kr
        </div>
        <button class="checkout-btn" onclick="goToCheckout()">Go to Checkout</button>
    </div>
</div>

<script>
    // Kundvagnens varor sparas här som en lista
    let cart = [];

    // Öppnar kundvagnen
    function openCart() {
        document.getElementById("cartDrawer").classList.add("open");
        document.getElementById("cartOverlay").classList.add("show");
        renderCart();
    }
    // Stänger kundvagnen
    function closeCart() {
        document.getElementById("cartDrawer").classList.remove("open");
        document.getElementById("cartOverlay").classList.remove("show");
    }


    function addToCart(btn) {
        // Hämta produktinfo från knappens data-attribut
        const id = btn.dataset.id;
        const title = btn.dataset.title;
        const price = parseFloat(btn.dataset.price);


        const existing = cart.find(item => item.id === id);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ id, title, price, quantity: 1 });
        }

        renderCart();
        openCart();
    }

    // Tar bort en vara från vagnen via dess id
    function removeFromCart(id) {
        // Filtrera bort varan med matchande id
        cart = cart.filter(item => item.id !== id);
        renderCart(); // Uppdatera visningen
    }

    // Ritar upp kundvagnen på skärmen
    function renderCart() {
        // Hämta elementen vi behöver uppdatera
        const cartContent = document.querySelector(".cart-content");
        const emptyCart = document.getElementById("emptyCart");
        const cartTotal = document.getElementById("cartTotal");

        // Om vagnen är tom, visa tomt-meddelande och avsluta
        if (cart.length === 0) {
            emptyCart.style.display = "block";
            cartTotal.textContent = "0";
            clearCartItems();
            return;
        }

        // Vagnen har varor, göm tomt-meddelandet
        emptyCart.style.display = "none";
        clearCartItems(); // Rensa gamla varor innan vi ritar nya

        // Loopa igenom varje vara och bygg HTML för den
        let total = 0;
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;

            // Skapa ett HTML-element för varan
            const div = document.createElement("div");
            div.className = "cart-item";
            div.innerHTML = `<span>${item.title} x${item.quantity}</span>
                <span>${itemTotal.toFixed(2)} kr</span>
                <button onclick="removeFromCart(${item.id})">✕</button>`;
            cartContent.appendChild(div); // Lägg till varan i vagnen
        });

        // Visa totalpriset längst ner
        cartTotal.textContent = total.toFixed(2);
    }

    // Hjälpfunktion för att rensa gamla varor innan vi ritar om
    function clearCartItems() {
        document.querySelectorAll(".cart-item").forEach(el => el.remove());
    }


    function goToCheckout() {
        // Stoppa om vagnen är tom
        if (cart.length === 0) {
            alert("your cart is empty");
            return;
        }

        // Spara vagnen i sessionStorage så orders kan läsa den
        sessionStorage.setItem("cart", JSON.stringify(cart));

        // Navigera till order
        window.location.href = "/orders";
    }

</script>

</body>
</html>
