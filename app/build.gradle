plugins{

	id 'java'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
    id "com.coditory.integration-test" version "2.2.5"
}

group = 'com.caniz'
version = '0.0.1-SNAPSHOT'

repositories{
	mavenCentral()
}

dependencies{

		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		developmentOnly 'org.springframework.boot:spring-boot-devtools'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
        implementation 'org.springframework.boot:spring-boot-starter-security'

        implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        runtimeOnly 'com.h2database:h2'
        runtimeOnly 'org.postgresql:postgresql'
        implementation 'org.springframework.boot:spring-boot-starter-webflux'


}

java{
	toolchain{
		languageVersion = JavaLanguageVersion.of(21)
	}
}



tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.named('test'){
	useJUnitPlatform()
    testLogging {

        events "passed", "skipped", "failed"
        showStandardStreams = true

    }

}


import org.springframework.boot.gradle.tasks.run.BootRun

tasks.register("bootDev", BootRun){

	group = 'application'
	description = 'this is using profile Dev'

	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.caniz.App'
	systemProperty 'spring.profiles.active', 'dev'
}

tasks.register("bootStage", BootRun){

	group = 'application'
	description = 'This app running profile Stage'

	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.caniz.App'
	systemProperty 'spring.profiles.active', 'stage'
}

