name: Deploy to Docker Hub

on:
  workflow_call:

env:
  IMAGE_NAME: diggykaze/intro-java

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # HÄR LÄGGER DU TILL DET (LÄNGST NER I FILEN):
  deploy-to-ec2:
    needs: build-and-push # Gör att deployen väntar tills bilden har tryckts upp till Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IPADRESS }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Logga in på Docker Hub inifrån din EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 2. Hämta den senaste bilden
            docker pull diggykaze/intro-java:latest
            
            # 3. Stoppa och ta bort den gamla containern om den körs
            docker stop intro-java-app || true
            docker rm intro-java-app || true
            
            # 4. Starta appen på nytt med den nya koden
            docker run -d -p 80:8080 --name intro-java-app diggykaze/intro-java:latest
